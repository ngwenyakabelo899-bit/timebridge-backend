spring.application.name=timebridge-backend

spring.datasource.url=jdbc:mysql://localhost:3306/timebridge_web?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email verification and email provider (values come from environment variables)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.brevo-api-key=${BREVO_API_KEY}
app.mail.from-email=${MAIL_FROM_EMAIL}
app.mail.from-name=${MAIL_FROM_NAME:TimeBridge}
app.verification.token-minutes=60